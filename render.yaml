services:
  - type: web
    name: resto-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./infra/api.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false
      - key: WEB_ORIGIN
        value: https://resto-web.onrender.com
      - key: APP_PUBLIC_URL
        value: https://resto-web.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_TTL_HOURS
        value: "336"
      - key: THROTTLE_LIMIT_PER_MIN
        value: "120"
      - key: THROTTLE_AUTH_LIMIT_PER_MIN
        value: "10"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MEDIA_FOLDER_PREFIX
        value: plateforme
      - key: FEDAPAY_ENV
        value: live
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_PUBLIC_KEY
        sync: false
      - key: FEDAPAY_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: Marketplace Cotonou
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: resto-web
    runtime: docker
    region: frankfurt
    plan: standard
    dockerfilePath: ./infra/web.Dockerfile
    dockerContext: .
    envVars:
      - key: API_INTERNAL_URL
        value: http://resto-api:10000
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://resto-api.onrender.com
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
